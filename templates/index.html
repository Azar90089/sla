<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf }}"><meta name="theme-color" content="#173b32"><title>Site Labour Attendance</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script defer src="{{ url_for('static', filename='app.js') }}"></script></head>
<body><main class="shell"><header class="top"><div class="mark">SA</div><div><p class="eyebrow">WORKSITE RECORDS</p><h1>Site Labour Attendance</h1><p class="sub">A clear daily count, kept in one place.</p></div></header>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<section class="card entry-card"><div class="section-head"><div><p class="eyebrow">DAILY ENTRY</p><h2 id="entry-title">Record attendance</h2></div><span id="mode-chip" class="chip" hidden>Edit mode</span></div>
<form id="attendance-form" novalidate><div class="fields"><label>Date<input id="attendance-date" type="date" value="{{ today }}" required></label><label>Labourers present<input id="labour-count" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 24" required></label></div>
<p id="date-hint" class="hint">Select a date and enter the total count.</p><div class="actions"><button id="submit-button" class="button primary">Save Attendance</button><button id="cancel-edit" class="button ghost" type="button" hidden>Cancel Edit</button></div></form></section>
<section class="card"><div class="section-head month-head"><div><p class="eyebrow">MONTHLY SUMMARY</p><h2>Attendance by month</h2></div><div class="month-nav"><button class="icon-button" id="prev-month" aria-label="Previous month">‹</button><input id="month-picker" type="month"><button class="icon-button" id="next-month" aria-label="Next month">›</button></div></div>
<div id="monthly-list" class="record-list"></div></section>

<footer>Attendance is stored in your application database.</footer></main>
<dialog id="confirm-dialog"><form method="dialog"><p class="eyebrow">CONFIRM ACTION</p><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div class="actions"><button id="dialog-cancel" class="button ghost" value="cancel">Cancel</button><button id="dialog-confirm" class="button primary" value="confirm">Confirm</button></div></form></dialog></body></html>
